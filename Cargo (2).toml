[package]
name = "systemforge-service"
version = "0.1.0"
edition = "2021"
description = "Serviço Windows privilegiado do SystemForge Optimizer — único processo que grava no Registro, Serviços, Tarefas Agendadas e Rede"

[dependencies]
systemforge-shared = { path = "../shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
rand = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Power",
    "Win32_Security",
] }
