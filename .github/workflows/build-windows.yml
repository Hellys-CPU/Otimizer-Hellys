name: Build Windows

# Roda em toda push/PR (só para validar que compila e os testes passam) e,
# quando uma tag `v*` é empurrada, também gera o instalador e publica um
# GitHub Release com ele anexado — é o "disponibilizar para baixar".
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry e target
        uses: Swatinem/rust-cache@v2

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Testar shared (protocolo IPC, validação, allowlist)
        run: cargo test -p systemforge-shared --release

      - name: Testar service (SCM, schtasks, netsh, servidor IPC ponta a ponta)
        run: cargo test -p systemforge-service --release

      - name: Checagem de tipos do frontend
        run: npx tsc --noEmit

      - name: Build do Serviço privilegiado (release)
        run: cargo build -p systemforge-service --release

      - name: Build do instalador (Tauri)
        run: npm run tauri build -- --verbose

      - name: Empacotar artefatos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Get-ChildItem -Path target -Recurse -Include *.exe,*.msi |
            Where-Object { $_.FullName -match "bundle" -or $_.Name -eq "systemforge-service.exe" } |
            ForEach-Object { Copy-Item $_.FullName -Destination dist-release -Force }
          Get-ChildItem dist-release

      - name: Publicar artefatos do build
        uses: actions/upload-artifact@v4
        with:
          name: systemforge-optimizer-windows
          path: dist-release/*
          if-no-files-found: error

      - name: Criar GitHub Release (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
